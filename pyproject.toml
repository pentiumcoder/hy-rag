[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hyrag"
version = "0.4.0"
description = "Production-style RAG over internal docs with hybrid BM25 + dense retrieval, reranking and verified citations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pentiumcoder" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "langchain-text-splitters>=0.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "fastembed>=0.5",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
eval = ["matplotlib>=3.8"]

[project.scripts]
hyrag = "hyrag.cli:app"

[project.urls]
Homepage = "https://github.com/pentiumcoder/hy-rag"
Issues = "https://github.com/pentiumcoder/hy-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hyrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["langchain_text_splitters.*", "pypdf.*", "rank_bm25.*", "openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "models: needs the real local models (downloads about 150 MB); run with HYRAG_TEST_MODELS=1",
    "llm: needs a running Ollama with the generator and judge models; run with HYRAG_TEST_LLM=1",
]

[tool.coverage.run]
source = ["hyrag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
