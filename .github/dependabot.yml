version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "pre-commit"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      test-tools:
        patterns: ["vitest", "@testing-library/*", "jsdom"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
